services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bfsi_erp
      POSTGRES_USER: bfsi
      POSTGRES_PASSWORD: bfsi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfsi -d bfsi_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: bfsi_erp
      POSTGRES_USER: bfsi
      POSTGRES_PASSWORD: bfsi
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
